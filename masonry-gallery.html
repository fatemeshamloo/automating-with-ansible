<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری مازونری انیمیشن دار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            color: white;
            overflow-x: hidden;
        }

        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-title {
            font-size: 4rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: heroFadeIn 2s ease-out;
        }

        @keyframes heroFadeIn {
            from {
                opacity: 0;
                transform: translateY(100px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            border: 2px solid white;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10px;
            animation: bounce 2s infinite;
        }

        .scroll-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: scrollDot 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        @keyframes scrollDot {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }

        .gallery-section {
            padding: 100px 20px;
            background: #0f0f23;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 50px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleSlideIn 1s ease-out;
        }

        @keyframes titleSlideIn {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .masonry-container {
            max-width: 1400px;
            margin: 0 auto;
            columns: 4;
            column-gap: 20px;
        }

        @media (max-width: 1200px) {
            .masonry-container { columns: 3; }
        }

        @media (max-width: 768px) {
            .masonry-container { columns: 2; }
        }

        @media (max-width: 480px) {
            .masonry-container { columns: 1; }
        }

        .masonry-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            break-inside: avoid;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(50px);
            animation: masonryItemFadeIn 0.8s ease-out forwards;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .masonry-item:nth-child(1) { animation-delay: 0.1s; }
        .masonry-item:nth-child(2) { animation-delay: 0.2s; }
        .masonry-item:nth-child(3) { animation-delay: 0.3s; }
        .masonry-item:nth-child(4) { animation-delay: 0.4s; }
        .masonry-item:nth-child(5) { animation-delay: 0.5s; }
        .masonry-item:nth-child(6) { animation-delay: 0.6s; }
        .masonry-item:nth-child(7) { animation-delay: 0.7s; }
        .masonry-item:nth-child(8) { animation-delay: 0.8s; }

        @keyframes masonryItemFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .masonry-item:hover {
            transform: translateY(-15px) rotateY(5deg) rotateX(5deg);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: all 0.5s ease;
            filter: brightness(0.9);
        }

        .masonry-item:hover img {
            filter: brightness(1.1) contrast(1.1);
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                rgba(255,107,107,0.8), 
                rgba(78,205,196,0.8), 
                rgba(69,183,209,0.8)
            );
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .masonry-item:hover .image-overlay {
            opacity: 1;
        }

        .overlay-text {
            text-align: center;
            color: white;
            transform: translateY(30px);
            transition: all 0.3s ease;
        }

        .masonry-item:hover .overlay-text {
            transform: translateY(0);
        }

        .overlay-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .overlay-description {
            font-size: 1rem;
            opacity: 0.9;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .masonry-item:hover .play-button {
            transform: translate(-50%, -50%) scale(1);
        }

        .play-button:before {
            content: '▶';
            margin-left: 5px;
        }

        /* Parallax Effect */
        .parallax-item {
            will-change: transform;
        }

        /* Loading Animation */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Filter Effects */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-button {
            padding: 12px 24px;
            background: transparent;
            color: white;
            border: 2px solid #4ecdc4;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }

        .filter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .filter-button:hover::before {
            left: 100%;
        }

        .filter-button:hover,
        .filter-button.active {
            background: #4ecdc4;
            color: #0f0f23;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(78,205,196,0.3);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            animation: lightboxFadeIn 0.3s ease;
        }

        @keyframes lightboxFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 95%;
            max-height: 95%;
            animation: lightboxZoomIn 0.4s ease;
        }

        @keyframes lightboxZoomIn {
            from {
                transform: translate(-50%, -50%) scale(0.3) rotate(15deg);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .lightbox img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        /* Scroll Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
            z-index: 1000;
            transition: width 0.1s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f23;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .fab:hover {
            transform: scale(1.1) rotate(360deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* Grid Animation */
        .masonry-item.grid-animation {
            animation: gridPulse 2s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <section class="hero-section">
        <h1 class="hero-title">گالری مازونری زیبا</h1>
        <div class="scroll-indicator"></div>
    </section>

    <section class="gallery-section">
        <h2 class="section-title">مجموعه تصاویر</h2>
        
        <div class="filter-bar">
            <button class="filter-button active" data-filter="all">همه تصاویر</button>
            <button class="filter-button" data-filter="nature">طبیعت</button>
            <button class="filter-button" data-filter="city">شهری</button>
            <button class="filter-button" data-filter="art">هنری</button>
            <button class="filter-button" data-filter="portrait">پرتره</button>
        </div>

        <div class="masonry-container" id="masonryContainer">
            <!-- Items will be populated by JavaScript -->
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="closeLightbox">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="" id="lightboxImage">
        </div>
    </div>

    <!-- Floating Action Button -->
    <div class="fab" id="fab" title="بازگشت به بالا">
        ↑
    </div>

    <script>
        // Gallery data with different sizes for masonry effect
        const masonryData = [
            { src: 'https://picsum.photos/400/500?random=1', title: 'طبیعت بکر', category: 'nature', description: 'جنگل سرسبز' },
            { src: 'https://picsum.photos/400/300?random=2', title: 'شهر مدرن', category: 'city', description: 'معماری شهری' },
            { src: 'https://picsum.photos/400/600?random=3', title: 'هنر خیابانی', category: 'art', description: 'گرافیتی زیبا' },
            { src: 'https://picsum.photos/400/400?random=4', title: 'پرتره', category: 'portrait', description: 'چهره زیبا' },
            { src: 'https://picsum.photos/400/700?random=5', title: 'آبشار', category: 'nature', description: 'آب‌های روان' },
            { src: 'https://picsum.photos/400/350?random=6', title: 'خیابان شب', category: 'city', description: 'نور شهر' },
            { src: 'https://picsum.photos/400/450?random=7', title: 'نقاشی', category: 'art', description: 'اثر هنری' },
            { src: 'https://picsum.photos/400/550?random=8', title: 'چشم‌انداز', category: 'nature', description: 'منظره کوهستان' },
            { src: 'https://picsum.photos/400/320?random=9', title: 'ساختمان', category: 'city', description: 'معماری مدرن' },
            { src: 'https://picsum.photos/400/480?random=10', title: 'مجسمه', category: 'art', description: 'هنر کلاسیک' },
            { src: 'https://picsum.photos/400/380?random=11', title: 'لبخند', category: 'portrait', description: 'شادی' },
            { src: 'https://picsum.photos/400/650?random=12', title: 'غروب', category: 'nature', description: 'خورشید طلایی' }
        ];

        let currentFilter = 'all';
        let currentImageIndex = 0;
        let filteredData = [...masonryData];

        // Initialize gallery
        function initMasonryGallery() {
            renderMasonry(masonryData);
            setupEventListeners();
            setupScrollEffects();
            setupParallax();
        }

        // Render masonry items
        function renderMasonry(items) {
            const container = document.getElementById('masonryContainer');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const masonryItem = document.createElement('div');
                masonryItem.className = 'masonry-item parallax-item';
                masonryItem.setAttribute('data-category', item.category);
                masonryItem.innerHTML = `
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="image-overlay">
                        <div class="overlay-text">
                            <div class="overlay-title">${item.title}</div>
                            <div class="overlay-description">${item.description}</div>
                        </div>
                        <div class="play-button"></div>
                    </div>
                `;

                masonryItem.addEventListener('click', () => openLightbox(index));
                container.appendChild(masonryItem);
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const filter = btn.getAttribute('data-filter');
                    filterMasonry(filter);
                });
            });

            // Lightbox
            document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
            document.getElementById('lightbox').addEventListener('click', (e) => {
                if (e.target.id === 'lightbox') closeLightbox();
            });

            // FAB
            document.getElementById('fab').addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Keyboard events
            document.addEventListener('keydown', (e) => {
                if (document.getElementById('lightbox').style.display === 'block') {
                    if (e.key === 'Escape') closeLightbox();
                }
            });
        }

        // Filter masonry items
        function filterMasonry(category) {
            currentFilter = category;
            
            if (category === 'all') {
                filteredData = [...masonryData];
            } else {
                filteredData = masonryData.filter(item => item.category === category);
            }

            // Animate out
            const items = document.querySelectorAll('.masonry-item');
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.style.transform = 'translateY(-50px) rotateX(90deg)';
                    item.style.opacity = '0';
                }, index * 50);
            });

            // Render new items
            setTimeout(() => {
                renderMasonry(filteredData);
            }, items.length * 50 + 200);
        }

        // Scroll effects
        function setupScrollEffects() {
            // Progress bar
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById('progressBar').style.width = scrolled + '%';
            });

            // Intersection observer for animations
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.masonry-item').forEach(item => {
                observer.observe(item);
            });
        }

        // Parallax effect
        function setupParallax() {
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const parallaxItems = document.querySelectorAll('.parallax-item');
                
                parallaxItems.forEach((item, index) => {
                    const speed = (index % 3 + 1) * 0.1;
                    const yPos = -(scrolled * speed);
                    item.style.transform = `translateY(${yPos}px)`;
                });
            });
        }

        // Open lightbox
        function openLightbox(index) {
            currentImageIndex = index;
            const item = filteredData[currentImageIndex];
            document.getElementById('lightboxImage').src = item.src;
            document.getElementById('lightboxImage').alt = item.title;
            document.getElementById('lightbox').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Random animation effects
        function addRandomAnimations() {
            setInterval(() => {
                const items = document.querySelectorAll('.masonry-item');
                const randomItem = items[Math.floor(Math.random() * items.length)];
                if (randomItem) {
                    randomItem.classList.add('grid-animation');
                    setTimeout(() => {
                        randomItem.classList.remove('grid-animation');
                    }, 2000);
                }
            }, 5000);
        }

        // Mouse trail effect
        function setupMouseTrail() {
            let mouseX = 0, mouseY = 0;
            let trail = [];

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;

                const trailElement = document.createElement('div');
                trailElement.style.position = 'fixed';
                trailElement.style.left = mouseX + 'px';
                trailElement.style.top = mouseY + 'px';
                trailElement.style.width = '10px';
                trailElement.style.height = '10px';
                trailElement.style.background = 'rgba(78,205,196,0.5)';
                trailElement.style.borderRadius = '50%';
                trailElement.style.pointerEvents = 'none';
                trailElement.style.zIndex = '9999';
                trailElement.style.animation = 'trailFade 1s ease-out forwards';

                document.body.appendChild(trailElement);

                setTimeout(() => {
                    if (trailElement.parentNode) {
                        trailElement.parentNode.removeChild(trailElement);
                    }
                }, 1000);
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            initMasonryGallery();
            addRandomAnimations();
            setupMouseTrail();
        });

        // Add CSS for trail fade animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes trailFade {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    transform: scale(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
